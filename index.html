<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="产品经理桌面端工作台原型" />
    <title>Orbit 产品工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M9 10h12"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></symbol>
      <symbol id="i-cycle" viewBox="0 0 24 24"><path d="M20 7h-6V1"/><path d="M20 7a8 8 0 1 0 1.4 7.6"/><path d="M4 17h6v6"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-setting" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6v.08h-4V20a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1h-.08v-4H4a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06L7.06 4.2l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6v-.08h4V4a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1h.08v4H20a1.7 1.7 0 0 0-.6 1z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M14.5 21h-5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 4h16l-6 7v7l-4 2v-9z"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    </svg>

    <section class="login-view" id="loginView">
      <div class="login-story">
        <div class="login-brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div><strong>Orbit</strong><small>产品协作中心</small></div>
        </div>
        <div class="story-content">
          <p class="story-kicker">PRODUCT WORKSPACE</p>
          <h1>让每一次产品决策<br />都有迹可循</h1>
          <p>统一管理产品原型、需求文档与迭代节奏，<br />让团队始终围绕同一个目标协作。</p>
          <div class="story-preview">
            <div class="preview-top"><span></span><span></span><span></span></div>
            <div class="preview-shell">
              <div class="preview-side"><i></i><i></i><i></i><i></i></div>
              <div class="preview-main">
                <div class="preview-heading"></div>
                <div class="preview-stats"><i></i><i></i><i></i></div>
                <div class="preview-board"><i></i><i></i></div>
              </div>
            </div>
          </div>
        </div>
        <p class="story-footer">Orbit Product Suite · 为产品团队而生</p>
      </div>
      <div class="login-panel">
        <form class="login-card" id="loginForm">
          <div class="login-mobile-brand">
            <div class="brand-mark"><span></span><span></span><span></span></div>
            <strong>Orbit</strong>
          </div>
          <p class="login-kicker">欢迎回来</p>
          <h2>登录产品工作台</h2>
          <p class="login-desc">使用你的账号密码继续访问 OneBank 产品空间。</p>
          <label class="login-label">账号
            <input id="loginUsername" type="text" autocomplete="username" placeholder="请输入账号" />
          </label>
          <label class="login-label">密码
            <span class="password-wrap">
              <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码" />
              <button type="button" class="password-toggle" id="passwordToggle">显示</button>
            </span>
          </label>
          <div class="login-options">
            <label><input id="rememberLogin" type="checkbox" checked /> 记住登录状态</label>
            <button type="button">忘记密码？</button>
          </div>
          <p class="login-error" id="loginError" role="alert"></p>
          <button class="login-submit" type="submit">登录工作台 <svg><use href="#i-arrow"></use></svg></button>
          <p class="login-tip">管理员演示账号：<strong>admin</strong> / <strong>admin</strong></p>
        </form>
      </div>
    </section>

    <div class="app-shell auth-hidden" id="appShell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div>
            <strong>Orbit</strong>
            <small>产品协作中心</small>
          </div>
        </div>

        <nav class="side-nav" aria-label="主导航">
          <button class="nav-item active" data-page="dashboard">
            <svg><use href="#i-grid"></use></svg><span>工作台</span>
          </button>
          <button class="nav-item" data-page="prototype">
            <svg><use href="#i-layout"></use></svg><span>产品原型</span><b>12</b>
          </button>
          <button class="nav-item" data-page="document">
            <svg><use href="#i-file"></use></svg><span>产品文档</span>
          </button>
          <button class="nav-item" data-page="iteration">
            <svg><use href="#i-cycle"></use></svg><span>迭代管理</span><i></i>
          </button>
        </nav>

        <p class="nav-label">空间</p>
        <nav class="side-nav compact" aria-label="空间导航">
          <button class="nav-item">
            <svg><use href="#i-box"></use></svg><span>产品知识库</span>
          </button>
          <button class="nav-item">
            <svg><use href="#i-users"></use></svg><span>团队成员</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <button class="nav-item">
            <svg><use href="#i-setting"></use></svg><span>空间设置</span>
          </button>
          <div class="workspace-card">
            <span class="workspace-icon">O</span>
            <div><strong>OneBank</strong><small>核心产品空间</small></div>
            <span class="switcher">⌄</span>
          </div>
        </div>
      </aside>

      <section class="main-shell">
        <header class="topbar">
          <div class="crumb"><span>OneBank</span><b>/</b><strong id="crumbTitle">工作台</strong></div>
          <label class="global-search">
            <svg><use href="#i-search"></use></svg>
            <input id="globalSearch" type="search" placeholder="搜索原型、文档或迭代" />
            <kbd>⌘ K</kbd>
          </label>
          <div class="top-actions">
            <button class="icon-btn bell" aria-label="通知"><svg><use href="#i-bell"></use></svg><span></span></button>
            <button class="help-btn">?</button>
            <div class="profile"><span>林</span><div><strong>林晓</strong><small>产品负责人</small></div></div>
            <button class="logout-btn" id="logoutButton">退出</button>
          </div>
        </header>

        <main id="pageRoot" class="page-root"></main>
      </section>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="关闭"><svg><use href="#i-close"></use></svg></button>
        <div class="modal-icon"><svg><use href="#i-plus"></use></svg></div>
        <h2 id="modalTitle">新建内容</h2>
        <p id="modalDescription">创建一条新的产品内容记录。</p>
        <label class="form-label">名称<input id="createName" type="text" placeholder="请输入名称" /></label>
        <label class="form-label">归属项目
          <select id="createProject"><option>OneBank App</option><option>商户管理后台</option><option>增长实验室</option></select>
        </label>
        <div class="prototype-form-fields auth-hidden" id="prototypeFormFields">
          <label class="form-label">文档说明<textarea id="createDescription" placeholder="简要说明原型目标与范围"></textarea></label>
          <label class="form-label">初始版本<input id="createVersion" type="text" value="V1.0" placeholder="例如 V1.0" /></label>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" id="modalCancel">取消</button>
          <button class="btn primary" id="modalConfirm">确认创建</button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast"><svg><use href="#i-check"></use></svg><span>创建成功</span></div>
    <script src="./app.js"></script>
  </body>
</html>
